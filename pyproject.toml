[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "call-center-intelligence-system"
version = "0.1.0"
description = "Production-grade multi-agent AI pipeline for call center QA, compliance, and reporting."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "faster-whisper>=1.0",
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "reportlab>=4.0",
    "gradio>=5.0,<6.0",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "langsmith>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
observability = [
    "langfuse>=3.0",
    # Langfuse's LangChain integration imports the full "langchain"
    # metapackage (not just langchain-core, which is already a core
    # dependency here) - install it unpinned so pip resolves a version
    # compatible with whatever langchain-core/langgraph are already in use.
    "langchain",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
